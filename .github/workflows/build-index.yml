name: Build WDC minutes index

on:
  push:
    paths:
      - '**/*.pdf'
      - '**/*.pptx'
      - '**/*.docx'
      - 'catalog/sources/**'
      - 'catalog/build_catalog.py'
      - '.github/workflows/build-index.yml'
  workflow_dispatch: {}
  schedule:
    - cron: '0 3 * * *' # daily at 03:00 UTC

permissions:
  contents: write

concurrency:
  group: build-index
  cancel-in-progress: false

jobs:
  build-index:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install pdftotext
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils

      - name: Restore extracted-text cache
        uses: actions/cache@v4
        with:
          path: catalog/.textcache
          key: textcache-${{ github.run_id }}
          restore-keys: textcache-

      - name: Build catalogue, index.json, minutes.json and data.json
        run: |
          python3 catalog/build_catalog.py . --write-repo-index \
            --raw-base "https://raw.githubusercontent.com/${{ github.repository }}/refs/heads/${{ github.ref_name }}/"

      - name: Commit & push generated files
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: rebuild catalogue and index"
          file_pattern: >-
            index.json minutes.json data.json
            catalog/*.json catalog/meetings/*.json catalog/COVERAGE.md catalog/missing-urls.txt
